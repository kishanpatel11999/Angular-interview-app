<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angular Senior Interview Prep — Loading Topic...</title>
  <script>
    (function () {
      // GitHub Pages SPA redirect handler
      var pathname = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash || '';

      var match = pathname.match(/^\/([^\/]+)(?:\/(.*))?$/);
      if (match) {
        var firstSeg = match[1];
        var rest = match[2] || '';
        
        if (window.location.hostname.endsWith('github.io')) {
          var target = '/' + firstSeg + '/?doc=' + encodeURIComponent(rest) + hash;
          window.location.replace(target);
          return;
        }
      }

      var clean = pathname.replace(/^\//, '');
      window.location.replace('/?doc=' + encodeURIComponent(clean) + hash);
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f19; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Loading Topic...</h2>
    <p style="color: #94a3b8;">Redirecting to <a href="./" style="color: #38bdf8; text-decoration: none;">Angular Senior Interview Prep Documentation</a></p>
  </div>
</body>
</html>
